name: Daily Gold Prediction Pipeline

on:
  schedule:
    # Run every day at 6:00 AM UTC (adjust for your timezone)
    # 6:00 AM UTC = 11:30 AM IST
    - cron: '0 6 * * *'
  
  # Allow manual trigger
  workflow_dispatch:

jobs:
  daily-pipeline:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install supabase
      
      - name: Run daily pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python automation/daily_pipeline.py
      
      - name: Commit updated predictions
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add models/ensemble/
          git diff --quiet && git diff --staged --quiet || git commit -m "Update daily predictions [$(date +%Y-%m-%d)]"
          git push