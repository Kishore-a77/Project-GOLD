name: Weekly Model Retraining

on:
  schedule:
    # Run every Sunday at 2:00 AM UTC (which is 7:30 AM IST)
    - cron: '0 2 * * 0'
  
  # Allow manual triggering
  workflow_dispatch:

jobs:
  weekly-training:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Fetch full history to get proper version info
          fetch-depth: 0
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      
      - name: Install pipeline dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-pipeline.txt
      
      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-huggingface-${{ hashFiles('requirements-pipeline.txt') }}
          restore-keys: |
            ${{ runner.os }}-huggingface-
      
      - name: Ensure Supabase schema
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python -c "
import os
import sys
from pathlib import Path
ROOT = Path(__file__).resolve().parents[2]
if ROOT not in sys.path:
    sys.path.insert(0, str(ROOT))
from app.db import supabase_client
supabase_client.ensure_schema()
          "
      
      - name: Weekly model retraining
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python automation/weekly_training.py